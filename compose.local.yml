services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      # 5433 en el host: el 5432 lo ocupa el Postgres de otro proyecto.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riuna -d riuna"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Copias de seguridad automaticas. Usa la misma imagen que el servidor para
  # que pg_dump y Postgres nunca se desalineen de version, y escribe en
  # ./backups del host. PGHOST se fija aqui: el .env compartido define
  # POSTGRES_HOST=localhost para la API, que corre fuera de Docker.
  backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGHOST: postgres
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        interval=$$(( ${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        while true; do
          sh /scripts/backup.sh || echo "[backup] la copia ha fallado"
          sleep "$$interval"
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1337:1337"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

#  Optional
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
