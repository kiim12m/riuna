# Riuna Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "riuna.fullname" . }}-riuna
  labels:
    {{- include "riuna.labels" . | nindent 4 }}
    app.kubernetes.io/component: riuna
spec:
  type: {{ .Values.riuna.service.type }}
  ports:
    - port: {{ .Values.riuna.service.port }}
      targetPort: riuna
      protocol: TCP
      name: http
  selector:
    {{- include "riuna.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: riuna

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "riuna.fullname" . }}-postgresql
  labels:
    {{- include "riuna.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "riuna.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
