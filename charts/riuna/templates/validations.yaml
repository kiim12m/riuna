{{- $publicExposureEnabled := or .Values.ingress.enabled .Values.gateway.enabled -}}
{{- if and (not .Values.riuna.env.existingSecret.enabled) (or (not .Values.riuna.env.authSecret) (lt (len (.Values.riuna.env.authSecret | toString)) 32)) -}}
{{- fail "riuna.env.authSecret must be explicitly set to at least 32 characters or provided via riuna.env.existingSecret" -}}
{{- end -}}
{{- if and $publicExposureEnabled .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) (eq .Values.postgresql.auth.password "riuna_password") -}}
{{- fail "postgresql.auth.password must be changed or provided via postgresql.auth.existingSecret before enabling ingress or gateway" -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled .Values.autoscaling.targetCPUUtilizationPercentage (not (dig "requests" "cpu" "" .Values.riuna.resources)) -}}
{{- fail "riuna.resources.requests.cpu must be set when autoscaling CPU utilization is enabled" -}}
{{- end -}}
