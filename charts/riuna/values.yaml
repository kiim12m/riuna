# Global values
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Pod configuration
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
# PostgreSQL database configuration
postgresql:
  # Set to true to deploy PostgreSQL as part of this chart
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Database configuration
  auth:
    database: riuna
    username: riuna_user
    password: riuna_password
    # Use existing secret for database credentials (optional)
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  # Persistence for PostgreSQL data
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # PostgreSQL service configuration
  service:
    type: ClusterIP
    port: 5432
  # Resources for PostgreSQL
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
# Riuna application configuration (combined API + web frontend)
riuna:
  image:
    repository: ghcr.io/kiim12m/riuna
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  securityContext: {}
  service:
    type: ClusterIP
    port: 5173
    targetPort: 5173
  # Resources are optional and disabled by default
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

  env:
    # Public URL of this Riuna instance (e.g. https://riuna.example.com)
    # RIUNA_API_URL is derived automatically as clientUrl/api if not set
    clientUrl: ""
    # Allowed CORS origins. Accepts a comma-separated string or YAML list.
    # Defaults to clientUrl when left empty.
    corsOrigins: []
    # Required Better Auth secret (minimum 32 characters), unless existingSecret is enabled.
    # Generate with: openssl rand -hex 32
    authSecret: ""
    existingSecret:
      enabled: false
      name: ""
      key: auth-secret
    disableRegistration: false
    disablePasswordRegistration: false
    disableEmailOtpSignIn: false
    # Database configuration
    database:
      # Use external PostgreSQL (set postgresql.enabled to false)
      # Important: when using external postgres, make sure you have set up the db user correctly:
      #   CREATE DATABASE riuna;
      #   CREATE USER riuna_user WITH PASSWORD 'your_password';
      #   GRANT ALL PRIVILEGES ON DATABASE riuna TO riuna_user;
      #   \c riuna;
      #   GRANT USAGE ON SCHEMA public TO riuna_user;
      #   GRANT CREATE ON SCHEMA public TO riuna_user;
      #   ALTER SCHEMA public OWNER TO riuna_user;
      external:
        enabled: false
        host: ""
        port: 5432
        database: riuna
        username: riuna_user
        password: ""
        # Use existing secret for external database credentials in the form of a uri, e.g.: "postgresql://user:pass@host:port/db"
        existingSecret:
          enabled: false
          name: ""
          passwordKey: postgres_uri
  # Additional environment variables for the riuna container.
  # Each entry is a standard Kubernetes EnvVar (supports `value` or `valueFrom`).
  # Useful for CUSTOM_OAUTH_*, SMTP_*, etc. without editing the chart.
  # extraEnv entries are appended after chart-defined vars; duplicate names override.
  extraEnv: []
  # extraEnv:
  #   - name: CUSTOM_OAUTH_DISCOVERY_URL
  #     value: "https://idp.example.com/.well-known/openid-configuration"
  #   - name: CUSTOM_OAUTH_CLIENT_ID
  #     valueFrom:
  #       secretKeyRef:
  #         name: oauth-secret
  #         key: client-id
  #
  # Dos que conviene no dejar en `extraEnv` porque se olvidan:
  #
  #   - name: NOTIFICATION_SECRET_ENCRYPTION_KEY
  #     value: ""   # sin ella, guardar un token de ntfy o Gotify responde 500
  #   - name: RIUNA_LOCAL_ACCOUNT_DOMAIN
  #     value: "local.riuna"  # queda grabado en el correo sintetico de cada
  #                           # cuenta local: cambiarlo despues no las migra
  # El arranque corre las migraciones **antes** de abrir el puerto, asi que no
  # hay /api/health hasta que terminan. La 0048 reescribe todas las filas de
  # `task` y la 0049 construye un GIN encima: en una instalacion con datos son
  # decenas de segundos, y en una grande varios minutos.
  #
  # Sin `startupProbe`, el liveness mataba el pod a mitad de migracion, Postgres
  # hacia rollback, el pod reiniciaba y volvia a empezar: CrashLoopBackOff
  # indefinido. Con el, el liveness no empieza a contar hasta que el arranque
  # termina, y el margen es generoso a proposito: 60 intentos x 10 s = 10 min.
  startupProbe:
    httpGet:
      path: /api/health
      port: riuna
    periodSeconds: 10
    failureThreshold: 60
  livenessProbe:
    httpGet:
      path: /api/health
      port: riuna
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: riuna
    periodSeconds: 10
# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: riuna.local
      paths:
        - path: /
          pathType: Prefix
          service: riuna
          port: 5173
  tls: []

# Gateway API configuration
gateway:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - service: riuna
          port: 5173
